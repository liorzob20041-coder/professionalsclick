name: Frontend QA
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  qa:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Python for Jinja/Flask
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install djlint
        run: |
          python -m pip install --upgrade pip
          pip install djlint

      - name: Lint templates
        run: |
          if [ -d "templates" ]; then
            djlint --profile=jinja templates --check --lint
          else
            echo "no templates"
          fi

      # Node tooling
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend tools
        run: |
          npm i -D stylelint stylelint-config-standard postcss postcss-html @lhci/cli pa11y-ci

      - name: Minify CSS (if project has build script)
        run: |
          if [ -f "balei-miktzoa-site/package.json" ]; then
            cd balei-miktzoa-site
            npm ci
            if npm run | grep -q "build:css"; then
              npm run build:css
            else
              echo "No build:css script, skipping"
            fi
          else
            echo "No package.json, skipping CSS build"
          fi

      - name: Stylelint
        continue-on-error: true
        run: |
          npx stylelint "**/*.css" "**/*.html" "templates/**/*.html" --formatter=string > stylelint-report.txt || true

      # Flask app deps
      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          if [ -f "balei-miktzoa-site/requirements.txt" ]; then pip install -r balei-miktzoa-site/requirements.txt; fi
          pip install -U Flask requests Jinja2 python-dotenv Flask-WTF WTForms deep-translator

      # Start Flask
      - name: Start Flask
        env:
          FLASK_DEBUG: "0"
          HOST: "127.0.0.1"
          PORT: "5000"
          INVITE_KEY: "ci-test-key"
          SECRET_KEY: "ci-secret-key"
        run: |
          set -euxo pipefail
          export PYTHONUNBUFFERED=1
          export PYTHONPATH="$(pwd):${PYTHONPATH-}"

          if [ -f "app.py" ]; then ENTRY="app.py";
          elif [ -f "balei-miktzoa-site/app.py" ]; then ENTRY="balei-miktzoa-site/app.py";
          elif [ -f "balei-miktzoa-site/app.clean.py" ]; then ENTRY="balei-miktzoa-site/app.clean.py";
          else echo "No Flask entry point found" >&2; ls -la; exit 1; fi

          echo "Using entry: $ENTRY"
          python "$ENTRY" > server.log 2>&1 & echo $! > flask.pid

          for i in {1..120}; do
            if curl -sSf http://127.0.0.1:5000/ >/dev/null; then
              echo "Flask is up"
              break
            fi
            if ! kill -0 "$(cat flask.pid)" 2>/dev/null; then
              echo "Flask process died early"
              echo "--- server.log ---"; tail -n +1 server.log || true
              exit 1
            fi
            sleep 1
          done

      # Warmup for stable metrics
      - name: Prewarm dynamic images
        run: |
          urls=(
            "http://127.0.0.1:5000/img/photo1.jpg?w=480&q=76&fit=cover&format=auto"
            "http://127.0.0.1:5000/img/photo1.jpg?w=640&q=76&fit=cover&format=auto"
            "http://127.0.0.1:5000/img/photo1.jpg?w=960&q=76&fit=cover&format=auto"
            "http://127.0.0.1:5000/img/photo2.jpg?w=480&q=76&fit=cover&format=auto"
            "http://127.0.0.1:5000/img/photo2.jpg?w=640&q=76&fit=cover&format=auto"
            "http://127.0.0.1:5000/img/photo2.jpg?w=960&q=76&fit=cover&format=auto"
          )
          for u in "${urls[@]}"; do curl -sSf "$u" >/dev/null || true; done
          curl -sS http://127.0.0.1:5000/he/ >/dev/null || true
          curl -sS http://127.0.0.1:5000/static/css/style.css >/dev/null || true

      # Lighthouse: collect + assert + upload
      - name: Lighthouse collect (5 runs, mobile)
        run: |
          npx lhci collect \
            --url=http://127.0.0.1:5000/he/ \
            --numberOfRuns=5 \
            --settings.throttlingMethod=simulate \
            --settings.formFactor=mobile \
            --settings.screenEmulation.mobile=true \
            --settings.chromeFlags="--no-sandbox"

      - name: Lighthouse assert (perf >= 0.80)
        run: |
          npx lhci assert --assertions.category-performance="error@>=0.80"

      - name: Lighthouse upload
        run: |
          npx lhci upload --target=filesystem --outputDir=./lhci-report

      # Accessibility
      - name: Accessibility (Pa11y)
        continue-on-error: true
        run: |
          echo '{ "defaults": { "standard": "WCAG2AA", "timeout": 30000 }, "urls": ["http://127.0.0.1:5000/he/"] }' > .pa11yci.json
          npx pa11y-ci | tee pa11y-report.txt || true

      # Artifacts
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: frontend-reports
          path: |
            lhci-report
            stylelint-report.txt
            pa11y-report.txt
            server.log
          if-no-files-found: ignore

      # Stop Flask
      - name: Stop Flask
        if: always()
        run: |
          if [ -f flask.pid ]; then kill "$(cat flask.pid)" || true; fi
