name: Frontend QA
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # HTML/Jinja lint
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install djlint
        run: |
          python -m pip install --upgrade pip
          pip install djlint
      - name: Lint templates
        run: |
          if [ -d "templates" ]; then djlint --profile=jinja templates --check --lint; else echo "no templates"; fi

      # Node tooling
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend tools
        run: |
          npm i -D stylelint stylelint-config-standard postcss postcss-html @lhci/cli pa11y-ci

      - name: Stylelint
        continue-on-error: true
        run: |
          npx stylelint "**/*.css" "**/*.html" "templates/**/*.html" --formatter=string > stylelint-report.txt || true

      # ===== App deps for Flask =====
      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          if [ -f "balei-miktzoa-site/requirements.txt" ]; then pip install -r balei-miktzoa-site/requirements.txt; fi
          pip install -U Flask requests Jinja2 python-dotenv Flask-WTF WTForms

      # ===== Start Flask and wait =====
      - name: Start Flask
        env:
          FLASK_DEBUG: "0"
          HOST: "127.0.0.1"
          PORT: "5000"
        run: |
          set -e
          export PYTHONPATH="$(pwd):$PYTHONPATH"

          # locate entry point
          if [ -f "app.py" ]; then ENTRY="app.py";
          elif [ -f "balei-miktzoa-site/app.py" ]; then ENTRY="balei-miktzoa-site/app.py";
          elif [ -f "balei-miktzoa-site/app.clean.py" ]; then ENTRY="balei-miktzoa-site/app.clean.py";
          else echo "No Flask entry point found" >&2; ls -la; exit 1; fi

          echo "Using entry: $ENTRY"
          python "$ENTRY" > server.log 2>&1 & echo $! > flask.pid

          # המתנה עד שהשרת עולה
          for i in {1..45}; do
            if curl -sSf http://127.0.0.1:5000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Server did not start"; tail -n +1 server.log || true
          exit 1

      - name: Lighthouse collect
        continue-on-error: true
        run: |
          npx lhci collect \
            --url=http://127.0.0.1:5000/ \
            --numberOfRuns=1 \
            --settings.chromeFlags="--no-sandbox" || true

      - name: Lighthouse upload
        continue-on-error: true
        run: |
          npx lhci upload --target=filesystem --outputDir=./lhci-report || true

      - name: Accessibility (Pa11y)
        continue-on-error: true
        run: |
          echo '{ "defaults": { "standard": "WCAG2AA", "timeout": 30000 }, "urls": ["http://127.0.0.1:5000/"] }' > .pa11yci.json
          npx pa11y-ci || true

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: frontend-reports
          path: |
            lhci-report
            stylelint-report.txt
            server.log
          if-no-files-found: ignore

      - name: Stop Flask
        if: always()
        run: |
          kill $(cat flask.pid) || true



