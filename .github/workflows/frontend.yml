name: Frontend QA
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  qa:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Python for Jinja/Flask
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install djlint
        run: |
          python -m pip install --upgrade pip
          pip install djlint

      - name: Lint templates
        run: |
          if [ -d "templates" ]; then
            djlint --profile=jinja templates --check --lint
          else
            echo "no templates"
          fi

      # Node tooling
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend tools
        run: |
          npm i -D stylelint stylelint-config-standard postcss postcss-html @lhci/cli@0.13.x pa11y-ci

      - name: Minify CSS (if project has build script)
        run: |
          if [ -f "balei-miktzoa-site/package.json" ]; then
            cd balei-miktzoa-site
            npm ci
            if npm run | grep -q "build:css"; then
              npm run build:css
            else
              echo "No build:css script, skipping"
            fi
            npx --yes lightningcss-cli static/css/style.css -o static/css/style.min.css --minify
          else
            echo "No package.json, skipping CSS build"
          fi

      - name: Stylelint
        continue-on-error: true
        run: |
          npx stylelint "**/*.css" "**/*.html" "templates/**/*.html" --formatter=string > stylelint-report.txt || true

      # Flask app deps
      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          if [ -f "balei-miktzoa-site/requirements.txt" ]; then pip install -r balei-miktzoa-site/requirements.txt; fi
          pip install -U Flask requests Jinja2 python-dotenv Flask-WTF WTForms deep-translator

      # Start Flask
      - name: Start Flask
        env:
          FLASK_DEBUG: "0"
          HOST: "127.0.0.1"
          PORT: "5000"
          INVITE_KEY: "ci-test-key"
          SECRET_KEY: "ci-secret-key"
        run: |
          set -euxo pipefail
          export PYTHONUNBUFFERED=1
          export PYTHONPATH="$(pwd):${PYTHONPATH-}"

          if [ -f "app.py" ]; then ENTRY="app.py";
          elif [ -f "balei-miktzoa-site/app.py" ]; then ENTRY="balei-miktzoa-site/app.py";
          elif [ -f "balei-miktzoa-site/app.clean.py" ]; then ENTRY="balei-miktzoa-site/app.clean.py";
          else echo "No Flask entry point found" >&2; ls -la; exit 1; fi

          echo "Using entry: $ENTRY"
          python "$ENTRY" > server.log 2>&1 & echo $! > flask.pid

          for i in {1..120}; do
            if curl -sSf http://127.0.0.1:5000/ >/dev/null; then
              echo "Flask is up"
              break
            fi
            if ! kill -0 "$(cat flask.pid)" 2>/dev/null; then
              echo "Flask process died early"
              echo "--- server.log ---"; tail -n +1 server.log || true
              exit 1
            fi
            sleep 1
          done

      # Warmup for stable metrics
      - name: Warmup cache
        run: |
          curl -sS http://127.0.0.1:5000/he/ >/dev/null || true
      - name: Warm image cache (scrape src/srcset)
        run: |
          set -euo pipefail
          base="http://127.0.0.1:5000"
          html="$(curl -sS "$base/he/")"
          printf "%s" "$html" \
            | grep -oE '(src|srcset)="[^"]+"' \
            | sed -E 's/^(src|srcset)="(.*)"$/\2/' \
            | tr ' ' '\n' \
            | sed 's/,/\n/g' \
            | sed -E 's/[[:space:]]+[0-9]+w$//' \
            | sed -E 's/[[:space:]]+([0-9.]+)x$//' \
            | grep -Ei '\.(png|jpe?g|webp|svg)(\?|$)' \
            | sed -E "s#^/#${base}/#" \
            | sort -u > warm-urls.txt
          echo "Warming:"
          cat warm-urls.txt || true
          while read -r u; do
            [ -n "$u" ] && curl -sS "$u" >/dev/null || true
          done < warm-urls.txt

      # Lighthouse: collect + assert + upload
      - name: Lighthouse (stable median)
        run: |
          set +e
          npx lhci autorun \
            --collect.url=http://127.0.0.1:5000/he/ \
            --collect.numberOfRuns=5 \
            --collect.settings.throttlingMethod=simulate \
            --collect.settings.formFactor=mobile \
            --collect.settings.screenEmulation.mobile=true \
            --collect.settings.chromeFlags="--no-sandbox --disable-dev-shm-usage" \
            --assert.assertions.category-performance="error@>=0.90" \
            --upload.target=filesystem \
            --upload.outputDir=./lhci-report
          status=$?
          if [ -f lhci-report/manifest.json ]; then
            jq -r 'map(select(.isRepresentativeRun==true))[0].htmlPath' lhci-report/manifest.json || true
            jq -r 'map(select(.isRepresentativeRun==true))[0].lhr.audits["largest-contentful-paint-element"].details.items[0].node.selector' lhci-report/manifest.json || true
          fi
          exit $status

      # Accessibility
      - name: Accessibility (Pa11y)
        continue-on-error: true
        run: |
          echo '{ "defaults": { "standard": "WCAG2AA", "timeout": 30000 }, "urls": ["http://127.0.0.1:5000/he/"] }' > .pa11yci.json
          npx pa11y-ci | tee pa11y-report.txt || true

      # Artifacts
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: frontend-reports
          path: |
            lhci-report
            stylelint-report.txt
            pa11y-report.txt
            server.log
          if-no-files-found: ignore

      # Stop Flask
      - name: Stop Flask
        if: always()
        run: |
          if [ -f flask.pid ]; then kill "$(cat flask.pid)" || true; fi
