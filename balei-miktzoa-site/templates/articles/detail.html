{% extends "base.html" %}
{% block title %}{{ (article.title if article is defined else None) or "כותרת המאמר" }} | בעלי מקצוע בקליק{% endblock %}
{% block content %}
  {% set article_body = article_body_html or '' %}
  <style>
  :root {
    color-scheme: light;
  }

  body {
    /* in base.html body may already have padding/margins; leave it, this is here just in case */
    margin: 0;
    background: #ffffff;
    color: #222;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .toc-demo-page {
    max-width: 1180px;
    margin: 40px auto;
    padding: 0 20px 60px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 260px;
    gap: 32px;
  }

  .toc-demo-main {
    min-width: 0;
    line-height: 1.8;
    font-size: 16px;
  }

  .toc-demo-main h1 {
    font-size: 32px;
    margin: 0 0 22px;
    color: #111;
  }

  .toc-demo-main h2 {
    font-size: 22px;
    margin: 32px 0 12px;
    color: #8B1538;
  }

  .toc-demo-main h3 {
    font-size: 18px;
    margin: 18px 0 10px;
    color: #4e0e22;
  }

  .toc-demo-main p {
    margin: 0 0 14px;
  }

  .toc-demo-sidebar {
    position: sticky;
    top: 24px;
    align-self: flex-start;
  }

  .toc-demo-toc {
    border-radius: 16px;
    padding: 16px 18px;
    background: #f9f5f7;
    border: 1px solid rgba(139, 21, 56, 0.18);
    font-size: 14px;
  }

  .toc-demo-toc-title {
    margin: 0 0 10px;
    font-size: 16px;
    font-weight: 700;
    color: #8B1538;
  }

  .toc-demo-toc-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 6px;
  }

  .toc-demo-toc-list li {
    line-height: 1.5;
  }

  .toc-demo-toc-list a {
    text-decoration: none;
    color: #444;
    padding: 4px 2px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: color 120ms ease, background 120ms ease;
  }

  .toc-demo-toc-list a:hover {
    color: #8B1538;
    background: rgba(139, 21, 56, 0.06);
  }

  .toc-demo-toc-list a.is-active {
    font-weight: 600;
    color: #8B1538;
  }

  @media (max-width: 900px) {
    .toc-demo-page {
      grid-template-columns: 1fr;
    }

    .toc-demo-sidebar {
      display: none;
    }
  }
  </style>

  <div class="toc-demo-page" dir="rtl">
    <main class="toc-demo-main" id="bm-article-main">
      {{ article_body | safe }}
    </main>

    <aside class="toc-demo-sidebar" aria-label="תוכן עניינים">
      <nav class="toc-demo-toc">
        <h2 class="toc-demo-toc-title">במאמר זה</h2>
        <ul class="toc-demo-toc-list"></ul>
      </nav>
    </aside>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const main = document.querySelector('#bm-article-main');
      const tocList = document.querySelector('.toc-demo-toc-list');

      if (!main || !tocList) {
        return;
      }

      const headings = Array.from(main.querySelectorAll('h2, h3'));
      if (!headings.length) {
        return;
      }

      const linkById = new Map();

      const slugify = (text) => {
        return text
          .toString()
          .trim()
          .toLowerCase()
          .replace(/[^\p{L}\p{N}\s-]/gu, '')
          .replace(/\s+/g, '-')
          .replace(/-+/g, '-');
      };

      headings.forEach((heading, index) => {
        if (!heading.id) {
          const slug = slugify(heading.textContent || `section-${index + 1}`);
          const baseId = slug || `section-${index + 1}`;
          let uniqueId = baseId;
          let counter = 1;

          while (document.getElementById(uniqueId)) {
            uniqueId = `${baseId}-${counter++}`;
          }

          heading.id = uniqueId;
        }

        const li = document.createElement('li');
        const link = document.createElement('a');
        link.href = `#${heading.id}`;
        link.textContent = heading.textContent || heading.id;

        link.addEventListener('click', (event) => {
          event.preventDefault();
          const target = document.getElementById(heading.id);
          if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        });

        li.appendChild(link);
        tocList.appendChild(li);
        linkById.set(heading.id, link);
      });

      let activeId = null;

      const setActive = (id) => {
        if (id === activeId) {
          return;
        }

        if (activeId && linkById.has(activeId)) {
          linkById.get(activeId).classList.remove('is-active');
        }

        if (id && linkById.has(id)) {
          linkById.get(id).classList.add('is-active');
          activeId = id;
        } else {
          activeId = null;
        }
      };

      const observer = new IntersectionObserver((entries) => {
        let bestId = activeId;
        let bestScore = Number.POSITIVE_INFINITY;
        const viewportCenter = window.innerHeight / 2;

        entries.forEach((entry) => {
          const rect = entry.boundingClientRect;
          const center = rect.top + rect.height / 2;
          const distance = Math.abs(center - viewportCenter);

          if (entry.isIntersecting && distance < bestScore) {
            bestScore = distance;
            bestId = entry.target.id;
          }
        });

        if (!entries.some((entry) => entry.isIntersecting)) {
          return;
        }

        setActive(bestId);
      }, {
        root: null,
        rootMargin: '-50% 0px -40% 0px',
        threshold: [0, 0.3, 0.6, 1],
      });

      headings.forEach((heading) => observer.observe(heading));
    });
  </script>
{% endblock %}
