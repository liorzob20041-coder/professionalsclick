{% extends "base.html" %}
{% block title %}{{ (article.title if article is defined else None) or "כותרת המאמר" }} | בעלי מקצוע בקליק{% endblock %}
{% block content %}
<section class="bm-article-hero">
  {# future hero content goes here, can be empty for now #}
</section>

<div class="bm-article-page" dir="rtl">
  <div class="bm-article-layout">
    <main id="bm-article-main" class="bm-article-main">
      {{ article_body | safe }}
    </main>

    <aside class="bm-article-toc" aria-label="תוכן עניינים">
      <nav class="bm-article-toc-card">
        <h2 class="bm-article-toc-title">במאמר זה</h2>
        <ul class="bm-article-toc-list"></ul>
      </nav>
    </aside>
  </div>
</div>

<style>
  .bm-article-page {
    max-width: 1180px;
    margin: 40px auto 80px;
    padding: 0 20px 60px;
  }

  .bm-article-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 260px;
    column-gap: 32px;
    align-items: flex-start;
  }

  .bm-article-main {
    min-width: 0;
    line-height: 1.8;
    font-size: 16px;
  }

  .bm-article-toc {
    position: relative;
  }

  .bm-article-toc-card {
    border-radius: 16px;
    padding: 16px 18px;
    background: #f9f5f7;
    border: 1px solid rgba(139, 21, 56, 0.18);
    font-size: 14px;
  }

  .bm-article-toc-title {
    margin: 0 0 10px;
    font-size: 16px;
    font-weight: 700;
    color: #8B1538;
  }

  .bm-article-toc-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 6px;
  }

  .bm-article-toc-list a {
    text-decoration: none;
    color: #444;
    padding: 4px 2px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: color 120ms ease, background 120ms ease;
  }

  .bm-article-toc-list a:hover {
    color: #8B1538;
    background: rgba(139, 21, 56, 0.06);
  }

  @media (max-width: 900px) {
    .bm-article-layout {
      grid-template-columns: 1fr;
    }

    .bm-article-toc {
      display: none;
    }
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const main = document.querySelector('#bm-article-main');
    const toc = document.querySelector('.bm-article-toc');
    const tocList = document.querySelector('.bm-article-toc-list');

    if (!main || !toc || !tocList) {
      return;
    }

    const headings = Array.from(main.querySelectorAll('h2, h3'));

    const slugify = (text) => {
      return text
        .toString()
        .trim()
        .toLowerCase()
        .replace(/[^\p{L}\p{N}\s-]/gu, '')
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-');
    };

    headings.forEach((heading, index) => {
      if (!heading.id) {
        const slug = slugify(heading.textContent || `section-${index + 1}`);
        const baseId = slug || `section-${index + 1}`;
        let uniqueId = baseId;
        let counter = 1;

        while (document.getElementById(uniqueId)) {
          uniqueId = `${baseId}-${counter++}`;
        }

        heading.id = uniqueId;
      }

      const li = document.createElement('li');
      const link = document.createElement('a');
      link.href = `#${heading.id}`;
      link.textContent = heading.textContent || heading.id;
      li.appendChild(link);
      tocList.appendChild(li);
    });
    const hero = document.querySelector('.bm-article-hero');
    const header = document.querySelector('.bm-site-header, header.site-header, .main-header');
    const headerHeight = header ? header.getBoundingClientRect().height : 0;
    let heroBottom;
    if (hero) {
      const heroRect = hero.getBoundingClientRect();
      heroBottom = heroRect.bottom + window.scrollY;
    } else {
      heroBottom = 250;
    }

    const tocRect = toc.getBoundingClientRect();
    const initialLeft = tocRect.left;
    const initialWidth = tocRect.width;

    function onScroll() {
      const y = window.scrollY;

      if (y + headerHeight < heroBottom) {
        toc.style.position = 'relative';
        toc.style.top = '';
        toc.style.left = '';
        toc.style.width = '';
      } else {
        toc.style.position = 'fixed';
        toc.style.top = `${headerHeight + 24}px`;
        toc.style.left = `${initialLeft}px`;
        toc.style.width = `${initialWidth}px`;
        toc.style.visibility = 'visible';
      }
    }
    window.addEventListener('scroll', onScroll);
    onScroll();
  });
</script>
{% endblock %}
